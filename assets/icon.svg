<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- a card, tilted, with three "filter rows" standing in for the builder form -->
  <g transform="rotate(-8 64 64)">
    <rect x="30" y="24" width="52" height="72" rx="7" fill="#ffffff" opacity="0.94"/>
    <rect x="38" y="36" width="36" height="6" rx="3" fill="#4338ca" opacity="0.75"/>
    <rect x="38" y="50" width="26" height="6" rx="3" fill="#4338ca" opacity="0.45"/>
    <rect x="38" y="64" width="32" height="6" rx="3" fill="#4338ca" opacity="0.45"/>
  </g>
  <!-- magnifier -->
  <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round">
    <circle cx="80" cy="78" r="20" fill="#4338ca"/>
    <path d="M95 93 L112 110"/>
  </g>
</svg>
